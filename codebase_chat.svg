<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Notebooks source -->
  <g font-family="JetBrains Mono, monospace" font-size="15" fill="#e2e8f0">
    <rect x="60" y="70" width="200" height="90" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="160" y="105" text-anchor="middle" font-weight="700">500+ Notebooks</text>
    <text x="160" y="128" text-anchor="middle" font-size="12" fill="#94a3b8">.ipynb history</text>

    <!-- Arrow -->
    <path d="M270 115 H330" stroke="url(#accent)" stroke-width="3" marker-end="url(#arrow)"/>

    <!-- Vector store -->
    <rect x="340" y="70" width="200" height="90" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="440" y="100" text-anchor="middle" font-weight="700">ChromaDB</text>
    <text x="440" y="122" text-anchor="middle" font-size="12" fill="#94a3b8">Vector Index</text>
    <text x="440" y="140" text-anchor="middle" font-size="12" fill="#94a3b8">+ BM25 Keyword</text>

    <path d="M550 115 H610" stroke="url(#accent)" stroke-width="3" marker-end="url(#arrow)"/>

    <!-- RRF fusion -->
    <rect x="620" y="70" width="130" height="90" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="685" y="105" text-anchor="middle" font-weight="700" font-size="13">Hybrid</text>
    <text x="685" y="125" text-anchor="middle" font-weight="700" font-size="13">Fusion (RRF)</text>

    <path d="M685 160 V210" stroke="url(#accent)" stroke-width="3" marker-end="url(#arrow)"/>

    <!-- Schema grounding -->
    <rect x="500" y="220" width="250" height="80" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="625" y="252" text-anchor="middle" font-weight="700">Schema Grounding</text>
    <text x="625" y="272" text-anchor="middle" font-size="12" fill="#94a3b8">tables · joins · filters</text>

    <path d="M500 260 H340" stroke="url(#accent)" stroke-width="3" marker-end="url(#arrow)"/>

    <!-- Code generation -->
    <rect x="90" y="220" width="250" height="80" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="215" y="252" text-anchor="middle" font-weight="700">Code Generation</text>
    <text x="215" y="272" text-anchor="middle" font-size="12" fill="#94a3b8">SQL / MongoDB</text>

    <path d="M215 300 V350" stroke="url(#accent)" stroke-width="3" marker-end="url(#arrow)"/>

    <!-- Safety layer -->
    <rect x="90" y="360" width="620" height="80" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="400" y="392" text-anchor="middle" font-weight="700">Safety Layer</text>
    <text x="400" y="413" text-anchor="middle" font-size="12" fill="#94a3b8">blocks DELETE / DROP / UPDATE · read-only DB creds · audit log</text>

    <path d="M400 440 V490" stroke="url(#accent)" stroke-width="3" marker-end="url(#arrow)"/>

    <!-- Output -->
    <rect x="250" y="500" width="300" height="70" rx="12" fill="none" stroke="url(#accent)" stroke-width="2"/>
    <text x="400" y="532" text-anchor="middle" font-weight="700" fill="#22d3ee">Safe, Grounded Query</text>
    <text x="400" y="552" text-anchor="middle" font-size="12" fill="#94a3b8">ready to run</text>
  </g>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#818cf8"/>
    </marker>
  </defs>
</svg>
